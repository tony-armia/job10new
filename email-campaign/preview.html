<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Job10 — Email Marketing Campaign Suite</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #111827;
      border-bottom: 1px solid #1F2937;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: rgba(79, 70, 229, 0.2);
      color: #818CF8;
      border: 1px solid rgba(129, 140, 248, 0.3);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tab-group {
      background: #1F2937;
      border-radius: 9999px;
      padding: 4px;
      display: inline-flex;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #4F46E5;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
    }
    .tab-btn:hover:not(.active) {
      color: #FFFFFF;
    }
    .device-group {
      background: #1F2937;
      border-radius: 9999px;
      padding: 4px;
      display: inline-flex;
    }
    .device-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .device-btn.active {
      background: #374151;
      color: #FFFFFF;
    }
    .meta-bar {
      background: #151D2F;
      border-bottom: 1px solid #1E293B;
      padding: 12px 24px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .meta-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
    }
    .meta-item strong {
      color: #94A3B8;
      font-weight: 500;
      margin-right: 4px;
    }
    .meta-item span {
      color: #F1F5F9;
      font-weight: 600;
    }
    .main-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      background: #0B0F19;
      overflow-y: auto;
    }
    .frame-container {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      background: #FFFFFF;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      width: 100%;
      max-width: 660px;
    }
    .frame-container.mobile-mode {
      max-width: 395px;
      border: 10px solid #1F2937;
      border-radius: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    iframe {
      width: 100%;
      height: 980px;
      border: none;
      display: block;
      background: #F8FAFC;
    }

    </div>
  </div>

    let currentTab = 'general';
    let currentDevice = 'desktop';

    function render() {
      const item = data[currentTab];
      document.getElementById('lbl-subject').textContent = item.subject;
      document.getElementById('lbl-preheader').textContent = item.preheader;

      const frame = document.getElementById('email-frame');
      frame.srcdoc = item.html;

      const container = document.getElementById('frame-container');
      if (currentDevice === 'mobile') {
        container.classList.add('mobile-mode');
        frame.style.height = '880px';
      } else {
        container.classList.remove('mobile-mode');
        frame.style.height = '1050px';
      }
    }

    function selectTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      render();
    }

    function setDevice(device) {
      currentDevice = device;
      document.getElementById('btn-desktop').classList.toggle('active', device === 'desktop');
      document.getElementById('btn-mobile').classList.toggle('active', device === 'mobile');
      render();
    }

    render();
  </script>
